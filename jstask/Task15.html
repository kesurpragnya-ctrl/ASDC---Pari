<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Remainder Calculation</h1>

    <script>

        let totalStudents = 47;
        let studentsPerGroup = 5;
        let completeGroups = Math.floor(totalStudents / studentsPerGroup);
        let leftOverStudents = totalStudents % studentsPerGroup;

        console.log("Total Students: " + totalStudents);
        console.log("Students Per Group: " + studentsPerGroup);
        console.log("Complete Groups:", completeGroups);
        console.log("Students Left Over:", leftOverStudents);


    </script>
</body>
</html>
