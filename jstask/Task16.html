<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <h1>Age Verification</h1>

    <script>

        let age = 20;

        if (age >= 18) {
            console.log("Age:", age);
            console.log("The person is 18 or older. Access granted.");
        } else {
            console.log("Age:", age);
            console.log("The person is under 18. Access denied.");
        }
        
    </script>
</body>
</html>
