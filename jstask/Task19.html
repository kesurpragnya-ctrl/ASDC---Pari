<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Number Comparison</h1>

    <script>
        

        let num1 = 25;
        let num2 = 40;


        console.log("First Number:", num1);
        console.log("Second Number:", num2);

        console.log("Is first number greater than second?", num1 > num2);
        console.log("Is first number smaller than second?", num1 < num2);
        console.log("Are both numbers equal?", num1 === num2);

        
    </script>
</body>
</html>
