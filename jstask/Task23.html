<body>
    <h1>Pass or Fail</h1>

    <script>
        

        let percentage = 72;


        if (percentage >= 35) {
            console.log("Percentage: " + percentage + "%");
            console.log("Pass");
        } else {
            console.log("Percentage: " + percentage + "%");
            console.log("Fail");
        }

        
    </script>
</body>
