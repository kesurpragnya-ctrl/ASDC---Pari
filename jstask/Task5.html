<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Data Type Identification</h1>
    <script>

        let personName = "Priya Sharma";
        let age = 28;
        let salary = 55000;
        let isEmployed = true;
        let emptyValue = null;
        


       console.log("Value: " + personName + " | Type: " + typeof personName);
       console.log("Value: " + age + " | Type: " + typeof age);
       console.log("Value: " + salary + " | Type: " + typeof salary);
       console.log("Value: " + isEmployed + " | Type: " + typeof isEmployed);
       console.log("Value: " + emptyValue + " | Type: " + typeof emptyValue); 
    
    </script>
</body>
</html>
