<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>
         Even or Odd
    </h1>

    <script>
        function checkEvenOdd(number) {
            if (number % 2 === 0) {
         console.log(`${number} is Even`);
        } else {
          console.log(`${number} is Odd`);
        }
        }

        checkEvenOdd(17);
        checkEvenOdd(42);
    </script>
</body>
</html>
