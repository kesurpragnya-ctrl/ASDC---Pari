<!DOCTYPE html>
<html lang="en">

<body>
    <h1>Pass or Fail</h1>

    <script>
        function checkPassFail(marks) {
            if (marks >= 40) {
                console.log("Pass");
            } else {
                console.log("Fail");
            }
        }

        checkPassFail(40);
        checkPassFail(35);
    </script>
</body>
