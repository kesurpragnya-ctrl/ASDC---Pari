<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <h1>Shopping Calculation</h1>

    <script>
        
        let productPrice = 750;
        let quantity = 4;
        let totalPrice = productPrice * quantity;
        let gstAmount = totalPrice * 0.18;
        let priceAfterGst = totalPrice + gstAmount


       console.log("Total Price: " + totalPrice);
       console.log("Price after adding 18% GST: " + priceAfterGst);


    </script>
</body>
</html>
